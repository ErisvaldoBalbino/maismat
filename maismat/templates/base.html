<!doctype html>
<html lang="pt-BR" data-theme="{{ prefs.theme }}" data-confetti="{{ 'on' if prefs.confetti else 'off' }}" data-sound="{{ 'on' if prefs.sound else 'off' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MaisMat{% endblock %} · MaisMat</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#efe7da">
  <link rel="preload" href="{{ url_for('static', filename='fonts/bricolage-grotesque-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/instrument-sans-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">+mat</a>
    <nav id="nav">
      <a href="{{ url_for('main.index') }}" {% if request.endpoint == 'main.index' %}class="active"{% endif %}>Treinar</a>
      <a href="{{ url_for('main.history') }}" {% if request.endpoint == 'main.history' %}class="active"{% endif %}>Histórico</a>
      <a href="{{ url_for('main.performance') }}" {% if request.endpoint == 'main.performance' %}class="active"{% endif %}>Desempenho</a>
    </nav>
    <div class="prefs">
      <button type="button" class="icon-btn" id="prefs-toggle" aria-expanded="false" aria-controls="prefs-panel" aria-label="Preferências" title="Preferências">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
      </button>
      <form class="prefs-panel" id="prefs-panel" method="post" action="{{ url_for('main.update_preferences') }}" hidden>
        <fieldset>
          <legend>Tema</legend>
          <div class="segmented">
            {% for key, name in THEMES.items() %}
            <label><input type="radio" name="theme" value="{{ key }}" {% if prefs.theme == key %}checked{% endif %}><span>{{ name }}{% if key == 'halloween' %} 🎃{% endif %}</span></label>
            {% endfor %}
          </div>
        </fieldset>
        <label class="switch">
          <input type="checkbox" name="confetti" value="1" {% if prefs.confetti %}checked{% endif %}>
          <span class="switch-track" aria-hidden="true"></span>
          Confete ao terminar um treino
        </label>
        <label class="switch">
          <input type="checkbox" name="sound" value="1" {% if prefs.sound %}checked{% endif %}>
          <span class="switch-track" aria-hidden="true"></span>
          Sons de acerto e erro
        </label>
        <noscript><button type="submit" class="btn small">Salvar</button></noscript>
      </form>
    </div>
  </header>
  <main class="container" id="main" data-page="{% block page %}{% endblock %}">
    {% block content %}{% endblock %}
    {# Avisos do servidor viram notificações (toasts) no cliente. #}
    <script type="application/json" class="flashes">{{ get_flashed_messages(with_categories=true)|tojson }}</script>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
